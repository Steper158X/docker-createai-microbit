server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/wasm;
    gzip_min_length 1024;


    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    # Hashed build assets: cache forever.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Self-hosted MakeCode. No SPA fallback here: a missing hexcache/<sha>.hex
    # must 404 so the editor reports it instead of parsing index.html.
    location /makecode/ {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache";
    }

    # SPA fallback for react-router (BrowserRouter).
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
